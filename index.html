<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">
  <title>Däckhotell · Woxnadalens Bilservice</title>
  <style>
:root {
  --ink: #141414;
  --ink-2: #2c2c2c;
  --muted: #5a5a5a;
  --muted-2: #7a7a7a;
  --line: #e4e4e4;
  --line-2: #ececec;
  --bg: #f2f2f3;
  --paper: #ffffff;
  --red: #c41a2b;
  --red-dark: #9e1423;
  --red-soft: #fdecee;
  --green: #157a45;
  --green-soft: #e6f5ec;
  --amber: #8a5a00;
  --amber-soft: #fff4d8;
  --blue: #1e4a86;
  --blue-soft: #e7eef8;
  --grey-soft: #f0f0f0;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 6px 16px rgba(0,0,0,.05);
  --radius: 14px;
  --nav-h: 62px;
  --font: "Avenir Next", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "SF Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.45; }
button, input, select, textarea { font-family: inherit; font-size: 16px; }
button { cursor: pointer; }
a { color: var(--red); }
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.demo-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 14px; background: #1a1a1a; color: #f0f0f0;
  font-size: 11px; letter-spacing: .04em; text-transform: uppercase;
  font-weight: 600;
}
.demo-bar span { opacity: .85; }
.demo-bar button {
  background: none; border: 1px solid rgba(255,255,255,.3); color: #fff;
  border-radius: 999px; padding: 4px 10px; font-size: 11px; letter-spacing: .03em;
  text-transform: uppercase; font-weight: 600;
}
.demo-bar button:active { background: rgba(255,255,255,.1); }

.top {
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 8px 16px 10px;
}
.top-logo { display: flex; align-items: center; justify-content: center; padding: 0 0 8px; }
.top-logo img { height: 38px; width: auto; display: block; }
.switcher {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  background: var(--bg); padding: 3px; border-radius: 12px;
}
.switcher button {
  border: 0; background: transparent; color: var(--muted);
  height: 36px; border-radius: 9px; font-weight: 650; font-size: 14px;
}
.switcher button.on { background: var(--paper); color: var(--ink); box-shadow: var(--shadow); }
.stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  margin-top: 8px;
}
.stat {
  background: var(--bg); border-radius: 10px; padding: 6px 6px 5px; text-align: center;
}
.stat b { display: block; font-size: 16px; letter-spacing: -.02em; line-height: 1.15; }
.stat span { display: block; font-size: 10px; color: var(--muted); margin-top: 1px; }

.content { flex: 1; padding: 14px 16px 24px; padding-bottom: calc(24px + var(--nav-h)); }
.content.kund { padding: 10px 16px 20px; }
.content.kund h1 { font-size: 24px; margin-bottom: 6px; }
.content.kund .lead { margin-bottom: 10px; font-size: 14px; }
.content.kund .field { margin-bottom: 8px; }
.content.kund .field input, .content.kund .field select { height: 48px; }
.content.kund .check { margin: 2px 0 12px; }

h1 { font-size: 26px; line-height: 1.15; letter-spacing: -.03em; margin: 0 0 8px; font-weight: 750; }
h2 { font-size: 20px; letter-spacing: -.02em; margin: 0 0 10px; font-weight: 700; }
h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; font-weight: 700; }
.lead { color: var(--muted); margin: 0 0 16px; font-size: 15px; }

.card {
  background: var(--paper); border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid var(--line-2);
  padding: 14px 14px;
}
.card + .card { margin-top: 10px; }
.card.tap { width: 100%; text-align: left; display: block; }
.card.tap:active { transform: scale(.99); }

.field { margin: 0 0 12px; }
.field label { display: block; font-size: 13px; font-weight: 650; margin: 0 0 6px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  width: 100%; border: 1px solid #d6d6d6; background: #fff; color: var(--ink);
  border-radius: 12px; padding: 0 14px; height: 52px;
  outline: none; appearance: none; -webkit-appearance: none;
}
.field textarea { height: auto; min-height: 88px; padding: 12px 14px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--ink); box-shadow: 0 0 0 3px rgba(20,20,20,.08);
}
.field select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 16 16'><path fill='none' stroke='%23141414' stroke-width='1.6' d='M3 6l5 5 5-5'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center;
  padding-right: 36px;
}
.reg-input { font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; font-weight: 650; }

.check {
  display: flex; align-items: flex-start; gap: 10px;
  margin: 4px 0 16px; font-size: 14px; color: var(--ink-2);
}
.check input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--red); flex: none; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; height: 52px; border: 0; border-radius: 12px;
  background: var(--red); color: #fff; font-weight: 700; font-size: 16px;
  letter-spacing: -.01em;
}
.btn:active { background: var(--red-dark); }
.btn:disabled { background: #c8c8c8; color: #fff; }
.btn.secondary { background: var(--ink); color: #fff; }
.btn.secondary:active { background: #000; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:active { background: var(--bg); }
.btn.ok { background: var(--green); }
.btn.sm { height: 44px; font-size: 15px; width: auto; padding: 0 16px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

.search-wrap { position: relative; margin-bottom: 14px; }
.search-wrap input {
  width: 100%; height: 56px; border-radius: 16px; border: 1px solid #d6d6d6;
  padding: 0 16px 0 46px; font-size: 18px; font-weight: 600; outline: none;
  background: var(--paper); box-shadow: var(--shadow);
}
.search-wrap input:focus { border-color: var(--ink); }
.search-wrap .ico {
  position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
  width: 20px; height: 20px; color: var(--muted);
}

.regnr { font-family: var(--mono); font-weight: 700; letter-spacing: .08em; font-size: 18px; }
.meta { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.row .left { min-width: 0; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; font-size: 15px; margin: 8px 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }

.badge {
  display: inline-flex; align-items: center; height: 24px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 750; letter-spacing: .04em;
  text-transform: uppercase; white-space: nowrap; flex: none;
}
.badge.inne { background: var(--green-soft); color: var(--green); }
.badge.ute { background: var(--grey-soft); color: #555; }
.badge.vantar { background: var(--amber-soft); color: var(--amber); }
.badge.skickat { background: var(--grey-soft); color: #555; }
.badge.levererat { background: var(--green-soft); color: var(--green); }
.badge.fel { background: var(--red-soft); color: var(--red); }
.badge.besvarad { background: var(--blue-soft); color: var(--blue); }
.badge.demo { background: #111; color: #fff; height: 20px; font-size: 10px; }

.qr-block { display: flex; flex-direction: column; align-items: center; margin: 0 0 12px; }
.qr-frame {
  background: #fff; border: 1px solid var(--line); border-radius: 16px;
  padding: 10px; box-shadow: var(--shadow);
}
.qr-frame svg { display: block; width: 108px; height: 108px; }
.qr-block p { margin: 6px 0 0; font-size: 11px; color: var(--muted); text-align: center; max-width: 260px; line-height: 1.35; }

.workshop-foot {
  margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 13px; text-align: center; line-height: 1.45;
}
.workshop-foot strong { color: var(--ink-2); font-weight: 700; }

.success { text-align: center; padding: 8px 0 6px; }
.success .mark {
  width: 64px; height: 64px; border-radius: 50%; background: var(--green-soft);
  color: var(--green); display: flex; align-items: center; justify-content: center;
  margin: 4px auto 14px;
}
.sms-bubble-wrap { margin: 18px 0 8px; text-align: left; }
.sms-label { font-size: 12px; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; }
.sms-bubble {
  background: #e8e8ed; border-radius: 18px 18px 18px 5px;
  padding: 12px 14px; font-size: 15px; line-height: 1.45; color: var(--ink);
}
.sms-bubble.out {
  background: #1f1f1f; color: #fff; border-radius: 18px 18px 5px 18px;
}

.botnav {
  position: fixed; left: 0; right: 0; bottom: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: rgba(255,255,255,.96); backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(5, 1fr);
  z-index: 20;
}
.botnav button {
  border: 0; background: none; color: var(--muted-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 10px; font-weight: 650; letter-spacing: .01em; height: var(--nav-h);
}
.botnav button.on { color: var(--ink); }
.botnav button svg { width: 22px; height: 22px; display: block; }
.botnav button.on svg { stroke-width: 2.1; }

.zone-tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 14px; }
.zone-tabs button {
  height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper);
  font-weight: 700; color: var(--ink-2);
}
.zone-tabs button small { display: block; font-weight: 550; color: var(--muted); font-size: 10px; }
.zone-tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.zone-tabs button.on small { color: rgba(255,255,255,.7); }

.shelf-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.slot {
  display: block; width: 100%; text-align: left;
  border: 1px solid var(--line); background: var(--paper); border-radius: 12px;
  padding: 8px 7px 7px; min-height: 68px;
}
.slot.free { background: #fafafa; border-style: dashed; }
.slot.occ { background: #171717; border-color: #171717; color: #fff; }
.slot .sid { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.slot.occ .sid { color: rgba(255,255,255,.55); }
.slot .sreg { font-family: var(--mono); font-weight: 700; letter-spacing: .04em; font-size: 12px; margin-top: 2px; }
.slot .ssub { font-size: 10px; color: var(--muted); margin-top: 1px; }
.slot.occ .ssub { color: rgba(255,255,255,.7); }
.slot:active { transform: scale(.98); }

.legend { display: flex; gap: 14px; margin: 0 0 12px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend .l-occ { background: #171717; }
.legend .l-free { background: #fafafa; border: 1px dashed #bbb; }

.banner {
  background: var(--green-soft); color: var(--green); border-radius: 12px;
  padding: 12px 14px; font-weight: 650; margin-bottom: 14px; font-size: 15px;
}
.banner.warn { background: var(--amber-soft); color: var(--amber); }
.preview {
  background: var(--paper); border-radius: var(--radius); border: 1px solid var(--line);
  padding: 14px; margin: 0 0 14px; box-shadow: var(--shadow);
}
.preview .from { font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 650; }

.list-item {
  display: block; width: 100%; text-align: left;
  background: var(--paper); border: 1px solid var(--line-2); border-radius: 12px;
  padding: 12px 14px; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
}
.reply {
  margin-top: 8px; background: var(--blue-soft); color: var(--blue);
  border-radius: 10px 10px 10px 3px; padding: 8px 10px; font-size: 14px;
}

.toast-wrap {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav-h) + 16px);
  z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.toast {
  background: #161616; color: #fff; border-radius: 12px; padding: 12px 14px;
  font-size: 14px; font-weight: 650; box-shadow: var(--shadow); pointer-events: auto;
}

.back {
  display: inline-flex; align-items: center; gap: 4px;
  border: 0; background: none; color: var(--ink); font-weight: 650;
  height: 36px; padding: 0; margin: 0 0 8px; font-size: 15px;
}
.err { color: var(--red); font-size: 13px; margin: -6px 0 10px; }

.admin-block { background: var(--paper); border: 1px solid var(--line-2); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.danger { margin-top: 8px; }
.danger .btn { background: transparent; color: var(--red); border: 1px solid var(--red); }
.fineprint { font-size: 12px; color: var(--muted-2); text-align: center; margin: 16px 0 0; }

.empty { text-align: center; color: var(--muted); padding: 28px 10px; }

dl.plain { margin: 0; }
dl.plain div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-2); font-size: 15px; }
dl.plain dt { color: var(--muted); }
dl.plain dd { margin: 0; font-weight: 650; text-align: right; }

@media (min-width: 720px) {
  #app { max-width: 430px; margin: 0 auto; border-left: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--bg); min-height: 100dvh; }
  body { background: #e8e8e8; }
  .botnav, .toast-wrap, .demo-bar, .top { max-width: 430px; left: 50%; transform: translateX(-50%); width: 100%; }
  .top, .demo-bar { transform: none; left: auto; width: auto; }
  .botnav, .toast-wrap { /* keep fixed within column */ }
}

html, body { overflow-x: hidden; }
body { min-height: 100dvh; }

  </style>
</head>

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.customers)) return parsed;
      }
    } catch (e) {}
    return seedState();
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function typLabel(t) {
    if (t === "Dubb") return "Vinter (dubb)";
    if (t === "Vinter") return "Vinter (friktion)";
    return "Sommar";
  }

  function statusLabel(s) {
    return s === "inne" ? "Inne" : s === "ute" ? "Ute" : "Väntar";
  }

  function typShort(t) {
    return t === "Dubb" ? "Dubb" : t === "Vinter" ? "Vinter" : "Sommar";
  }

  function mm(n) {
    if (n == null || n === "") return "—";
    return String(n).replace(".", ",") + " mm";
  }

  function firstNamePart(namn) {
    if (!namn) return "";
    return " " + namn.split(" ")[0];
  }

  function renderText(tpl, c) {
    return (tpl || "")
      .replaceAll("{namn}", firstNamePart(c && c.namn))
      .replaceAll("{regnr}", (c && c.regnr) || "")
      .replaceAll("{hylla}", (c && c.hylla) || "—")
      .replaceAll("{typ}", c ? typLabel(c.typ) : "");
  }

  function formatTime(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getDate()} ${MONTHS[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function nowIso() { return new Date().toISOString(); }

  function smsThisMonth() {
    const now = new Date();
    return state.sms.filter(s => {
      const d = new Date(s.at);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    }).length;
  }

  function occupiedMap() {
    const m = {};
    state.customers.forEach(c => { if (c.hylla && c.status === "inne") m[c.hylla] = c; });
    return m;
  }

  function freeShelves(keep) {
    const occ = occupiedMap();
    return allShelves().filter(s => !occ[s] || s === keep);
  }

  function stats() {
    const inne = state.customers.filter(c => c.status === "inne").length;
    const tot = allShelves().length;
    return { inne, lediga: tot - inne, sms: smsThisMonth(), tot };
  }

  function normalizeRegnr(v) {
    const s = (v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (s.length >= 6) return s.slice(0, 3) + " " + s.slice(3, 6);
    return (v || "").toUpperCase().trim();
  }

  function validRegnr(v) {
    return /^[A-Z]{3} [0-9]{3}$/.test(normalizeRegnr(v));
  }

  function normalizePhone(v) {
    const d = (v || "").replace(/\D/g, "");
    let n = d;
    if (n.startsWith("46")) n = "0" + n.slice(2);
    if (n.length === 10 && n.startsWith("07")) {
      return n.slice(0, 3) + "-" + n.slice(3, 6) + " " + n.slice(6, 8) + " " + n.slice(8, 10);
    }
    return (v || "").trim();
  }

  function validPhone(v) {
    const d = (v || "").replace(/\D/g, "");
    const n = d.startsWith("46") ? "0" + d.slice(2) : d;
    return /^07\d{8}$/.test(n);
  }

  function findByReg(reg) {
    const n = normalizeRegnr(reg);
    return state.customers.find(c => c.regnr === n);
  }

  function addSms(kund, typ, text, status, extra) {
    const item = Object.assign({
      id: state.nextSmsId++,
      kundId: kund ? kund.id : null,
      typ, text, status: status || "skickat",
      at: nowIso(),
      riktning: "ut"
    }, extra || {});
    state.sms.unshift(item);
    saveState();
    return item;
  }

  function toast(msg) {

  function qrSvg(px) {
    const m = QR_MATRIX;
    if (!m || !m.length) return "";
    const n = m.length, border = 2, dim = n + border * 2;
    let rects = "";
    for (let y = 0; y < n; y++) {
      for (let x = 0; x < n; x++) {
        if (m[y][x] === "1") rects += `<rect x="${x + border}" y="${y + border}" width="1" height="1"/>`;
      }
    }
    return `<svg viewBox="0 0 ${dim} ${dim}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR-kod till registreringssidan"><rect width="${dim}" height="${dim}" fill="#fff"/>${rects}</svg>`;
  }

  function parseHash() {
    const hash = (location.hash || "#registrera").replace(/^#/, "");
    const [path, qs] = hash.split("?");
    const parts = path.split("/").filter(Boolean);
    const params = new URLSearchParams(qs || "");
    if (!parts[0] || parts[0] === "kund" || parts[0] === "registrera") {
      ui.mode = "kund";
      ui.success = parts[1] === "tack" ? (params.get("id") || true) : null;
    } else if (parts[0] === "set" && parts[1]) {
      ui.mode = "verkstad";
      ui.tab = "detalj";
      ui.setId = Number(parts[1]);
    } else {
      ui.mode = "verkstad";
      ui.tab = parts[0] || "sok";
      if (params.get("q") != null) ui.q = params.get("q");
      if (params.get("zon")) ui.zone = params.get("zon");
    }
  }

  function go(hash) {
    if (location.hash === "#" + hash) { parseHash(); render(); }
    else location.hash = hash;
  }

  function searchHits() {

    return list.filter(c =>
      c.regnr.toLowerCase().replace(/\s+/g, "").includes(q) ||
      c.namn.toLowerCase().replace(/\s+/g, "").includes(q) ||
      c.telefon.replace(/\s+/g, "").includes(q) ||
      (c.hylla || "").toLowerCase().includes(q) ||

  function viewDetalj() {
    const c = state.customers.find(x => x.id === ui.setId);
    if (!c) return `<div class="content"><p>Hittades inte.</p></div>`;
    const options = freeShelves(c.hylla).map(s =>
      `<option value="${esc(s)}" ${s === c.hylla ? "selected" : ""}>${esc(s)}</option>`
    ).join("");
    return `<div class="content">
      <button type="button" class="back" data-act="go" data-hash="/sok">${ICO.back} Till sök</button>
      <div class="row" style="margin-bottom:8px">
        <div class="left">
          <div class="regnr" style="font-size:22px">${esc(c.regnr)}</div>
          <h2 style="margin:2px 0 0">${esc(c.namn)}</h2>
        </div>
        <span class="badge ${c.status}">${esc(statusLabel(c.status))}</span>
      </div>
      <dl class="kv">
        <dt>Mobil</dt><dd>${esc(c.telefon)}</dd>
        <dt>Bil</dt><dd>${esc(c.bil || "—")}</dd>
        <dt>Däcktyp</dt><dd>${esc(typLabel(c.typ))}</dd>
        <dt>Fälg</dt><dd>${c.falgar ? "Med fälg" : "Utan fälg"}</dd>
        <dt>Hylla</dt><dd>${esc(c.hylla || "—")}</dd>
      </dl>
      ${c.status === "inne"
        ? `<button type="button" class="btn" data-act="lamna-ut" data-id="${c.id}">Lämna ut och skicka SMS-kvitto</button>`
        : `<button type="button" class="btn ok" data-act="lamna-in" data-id="${c.id}">Lämna in och skicka SMS-kvitto</button>`}
      <h3>Uppgifter</h3>
      <form id="detalj-form" data-id="${c.id}">
        <div class="field">
          <label for="d-hylla">Hylla</label>
          <select id="d-hylla" name="hylla">
            <option value="">Ingen hylla</option>
            ${options}
          </select>
        </div>
        <div class="field">
          <label for="d-monster">Mönsterdjup (mm)</label>
          <input id="d-monster" name="monster" type="number" inputmode="decimal" step="0.1" min="0" max="16" value="${c.monster ?? ""}">
        </div>
        <div class="field">
          <label for="d-kom">Kommentar</label>
          <textarea id="d-kom" name="kommentar" rows="3">${esc(c.kommentar || "")}</textarea>
        </div>
        <button class="btn secondary" type="submit">Spara uppgifter</button>
      </form>
    </div>`;
  }

  function viewHyllor() {
    const occ = occupiedMap();
    const zone = ui.zone;
    const slots = allShelves().filter(s => s.startsWith(zone + "-"));
    const used = slots.filter(s => occ[s]).length;
    const tabs = "ABCD".split("").map(z => {
      const zs = allShelves().filter(s => s.startsWith(z + "-"));
      const u = zs.filter(s => occ[s]).length;
      return `<button type="button" class="${zone === z ? "on" : ""}" data-act="zone" data-zone="${z}">${z}<small>${u}/${zs.length}</small></button>`;
    }).join("");
    const cells = slots.map(s => {
      const c = occ[s];
      if (c) {
        return `<button type="button" class="slot occ" data-act="go" data-hash="/set/${c.id}">
          <div class="sid">${esc(s)}</div>
          <div class="sreg">${esc(c.regnr)}</div>
          <div class="ssub">${esc(typShort(c.typ))} · ${esc(mm(c.monster))}</div>
        </button>`;
      }
      return `<button type="button" class="slot free" data-act="ledig" data-hylla="${esc(s)}">
        <div class="sid">${esc(s)}</div>
        <div class="sreg">Ledig</div>
        <div class="ssub">Plats ledig</div>
      </button>`;
    }).join("");
    return `<div class="content">
      <h2>Hyllöversikt</h2>
      <div class="legend"><span><i class="l-occ"></i>Upptagen</span><span><i class="l-free"></i>Ledig</span></div>
      <div class="zone-tabs">${tabs}</div>
      <p class="meta" style="margin:-4px 0 10px">Zon ${esc(zone)} · ${used} upptagna, ${slots.length - used} lediga</p>
      <div class="shelf-grid">${cells}</div>
    </div>`;
  }

  function recipientsFor(riktning) {
    if (riktning === "vs") return state.customers.filter(c => c.status === "inne" && (c.typ === "Vinter" || c.typ === "Dubb"));
    return state.customers.filter(c => c.status === "inne" && c.typ === "Sommar");
  }

  function viewKallelse() {
    const rik = ui.kallelseRiktning;
    const rec = recipientsFor(rik);
    const tpl = rik === "vs" ? state.settings.texts.kallelseVS : state.settings.texts.kallelseSV;
    const sample = rec[0] || { namn: "Anna Lindberg", regnr: "YTP 184", typ: "Vinter", hylla: "B-02-1" };
    const preview = renderText(tpl, sample);
    const sent = state.kallelse && state.kallelse.riktning === rik;
    let body;
    if (sent) {
      const order = { besvarad: 0, fel: 1, skickat: 2, levererat: 3 };
      const rows = state.kallelse.mottagare.slice().sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9)).map(m => {
        const c = state.customers.find(x => x.id === m.id);
        return `<div class="list-item">
          <div class="row">
            <div class="left">
              <div class="regnr" style="font-size:16px">${esc(c ? c.regnr : "")}</div>
              <div class="meta">${esc(c ? c.namn : "")} · ${esc(c ? c.telefon : "")}</div>
            </div>
            <span class="badge ${m.status}">${esc(m.status === "besvarad" ? "Besvarad" : m.status === "levererat" ? "Levererat" : m.status === "fel" ? "Fel" : "Skickat")}</span>
          </div>
          ${m.svar ? `<div class="reply">${esc(m.svar)}</div>` : ""}
        </div>`;
      }).join("");
      body = `<div class="banner">${state.kallelse.mottagare.length} SMS skickade · simulerad leverans</div>${rows}`;
    } else {
      body = `<p class="lead">${rec.length} kunder med ${rik === "vs" ? "vinterdäck" : "sommardäck"} inne får kallelsen.</p>
        <div class="preview">
          <div class="from">Förhandsvisning · från ${esc(state.settings.avsandare)}</div>
          <div>${esc(preview)}</div>
        </div>
        <button type="button" class="btn" data-act="skicka-kallelse" ${rec.length ? "" : "disabled"}>Skicka till ${rec.length} mottagare</button>
        <p class="fineprint">I demon skickas inga riktiga SMS. Status och några svar simuleras.</p>`;
    }
    return `<div class="content">
      <h2>Säsongskallelse</h2>
      <div class="field">
        <label for="f-rik">Byte</label>
        <select id="f-rik">
          <option value="vs" ${rik === "vs" ? "selected" : ""}>Vinter → sommar</option>
          <option value="sv" ${rik === "sv" ? "selected" : ""}>Sommar → vinter</option>
        </select>
      </div>
      ${body}
      ${sent ? `<button type="button" class="btn ghost" style="margin-top:8px" data-act="ny-kallelse">Ny förhandsvisning</button>` : ""}
    </div>`;
  }

  function smsTypLabel(t) {
    return ({ bekraftelse: "Bekräftelse", inlamning: "Kvitto inlämning", utlamning: "Kvitto utlämning", kallelse: "Kallelse", svar: "Svar från kund" })[t] || t;
  }

  function viewSms() {
    const items = state.sms.slice().sort((a, b) => new Date(b.at) - new Date(a.at));
    const rows = items.map(s => {
      const c = state.customers.find(x => x.id === s.kundId);
      const isIn = s.riktning === "in" || s.typ === "svar";
      return `<div class="list-item">
        <div class="row">
          <div class="left">
            <div style="font-weight:700">${esc(smsTypLabel(s.typ))}</div>
            <div class="meta">${esc(c ? c.namn : "—")} · ${esc(c ? c.regnr : "")} · ${esc(formatTime(s.at))}</div>
          </div>
          <span class="badge ${s.status}">${esc(s.status === "besvarad" ? "Besvarad" : s.status === "levererat" ? "Levererat" : s.status === "fel" ? "Fel" : "Skickat")}</span>
        </div>
        <div class="sms-bubble-wrap" style="margin:10px 0 0">
          <div class="sms-bubble ${isIn ? "" : "out"}">${esc(s.text)}</div>
        </div>
      </div>`;
    }).join("");
    return `<div class="content">
      <h2>SMS-logg</h2>
      <p class="lead">${items.length} meddelanden · ${smsThisMonth()} denna månad · ${esc(state.settings.avsandare)}</p>
      ${rows || `<div class="empty">Inga SMS ännu.</div>`}
    </div>`;
  }

  function viewAdmin() {
    const t = state.settings.texts;
    const s = state.settings;
    const st = stats();
    return `<div class="content">
      <h2>Admin</h2>
      <div class="admin-block">
        <h3 style="margin-top:0">Verkstad</h3>
        <dl class="plain">
          <div><dt>Namn</dt><dd>${esc(WORKSHOP.name)}</dd></div>
          <div><dt>Adress</dt><dd>${esc(WORKSHOP.address)}, ${esc(WORKSHOP.zip)} ${esc(WORKSHOP.city)}</dd></div>
          <div><dt>Telefon</dt><dd>${esc(WORKSHOP.phone)}</dd></div>
          <div><dt>E-post</dt><dd>${esc(WORKSHOP.email)}</dd></div>
          <div><dt>Öppet</dt><dd>${esc(WORKSHOP.hours)}</dd></div>
        </dl>
      </div>
      <form id="admin-form">
        <div class="admin-block">
          <h3 style="margin-top:0">SMS-texter</h3>
          <div class="field">
            <label for="a-from">Avsändarnamn</label>
            <input id="a-from" name="avsandare" maxlength="11" value="${esc(s.avsandare)}">
          </div>
          <div class="field"><label for="a-bek">Bekräftelse vid registrering</label><textarea id="a-bek" name="bekraftelse" rows="4">${esc(t.bekraftelse)}</textarea></div>
          <div class="field"><label for="a-in">Kvitto inlämning</label><textarea id="a-in" name="inlamning" rows="3">${esc(t.inlamning)}</textarea></div>
          <div class="field"><label for="a-ut">Kvitto utlämning</label><textarea id="a-ut" name="utlamning" rows="3">${esc(t.utlamning)}</textarea></div>
          <div class="field"><label for="a-vs">Kallelse vinter → sommar</label><textarea id="a-vs" name="kallelseVS" rows="4">${esc(t.kallelseVS)}</textarea></div>
          <div class="field"><label for="a-sv">Kallelse sommar → vinter</label><textarea id="a-sv" name="kallelseSV" rows="4">${esc(t.kallelseSV)}</textarea></div>
          <p class="meta">Platshållare: {namn} {regnr} {hylla} {typ}</p>
        </div>
        <div class="admin-block">
          <h3 style="margin-top:0">Zoner och säsong</h3>
          <p class="meta" style="margin-top:0">Fyra zoner (A–D), hyll-ID enligt zon-plats-nivå, t.ex. A-03-2. ${st.tot} platser totalt, ${st.inne} upptagna.</p>
          <div class="field">
            <label for="a-som">Sommarsäsong börjar</label>
            <input id="a-som" name="sommarStart" type="date" value="${esc(s.sommarStart)}">
          </div>
          <div class="field">
            <label for="a-vin">Vintersäsong börjar</label>
            <input id="a-vin" name="vinterStart" type="date" value="${esc(s.vinterStart)}">
          </div>
        </div>
        <button class="btn secondary" type="submit">Spara inställningar</button>
      </form>
      <div class="admin-block danger">
        <h3 style="margin-top:0">Demo</h3>
        <p class="meta">Återställer kunder, hyllor, SMS-logg och texter till ursprunglig demodata.</p>
        <button type="button" class="btn" data-act="reset">Återställ demo</button>
      </div>
    </div>`;
  }

  function render() {
    const app = document.getElementById("app");
    const active = document.activeElement;
    const aid = active && active.id;
    const start = active && active.selectionStart;
    const end = active && active.selectionEnd;
    const scroll = window.scrollY;
    let page = "";
    if (ui.mode === "kund") page = viewKund();
    else if (ui.tab === "hyllor") page = viewHyllor();
    else if (ui.tab === "kallelse") page = viewKallelse();
    else if (ui.tab === "sms") page = viewSms();
    else if (ui.tab === "admin") page = viewAdmin();
    else if (ui.tab === "detalj") page = viewDetalj();
    else page = viewSok();
    app.innerHTML = demoBar() + topBar() + page + botNav() + toastHtml();
    bindDynamic();
    if (aid) {
      const el = document.getElementById(aid);
      if (el) {
        el.focus();
        try { if (start != null) el.setSelectionRange(start, end); } catch (e) {}
      }
    }
    window.scrollTo(0, scroll);
  }

  function bindDynamic() {
    const form = document.getElementById("reg-form");
    if (form) form.addEventListener("submit", onRegister);
    const q = document.getElementById("f-q");
    if (q) {
      q.addEventListener("input", ev => {
        ui.q = ev.target.value;
        const hits = searchHits();
        const meta = ev.target.closest(".content").querySelector(".meta");
        if (meta) meta.textContent = ui.q
          ? `${hits.length} träff${hits.length === 1 ? "" : "ar"}`
          : `Alla ${hits.length} däckset · demodata`;
        const holder = ev.target.closest(".content");
        const existing = [...holder.querySelectorAll(".list-item, .empty")];
        existing.forEach(n => n.remove());
        const html = hits.length ? hits.map(kundCard).join("") : `<div class="empty">Ingen träff på “${esc(ui.q)}”.</div>`;
        holder.insertAdjacentHTML("beforeend", html);
      });
    }
    const rik = document.getElementById("f-rik");
    if (rik) rik.addEventListener("change", ev => {
      ui.kallelseRiktning = ev.target.value;
      render();
    });
    const det = document.getElementById("detalj-form");
    if (det) det.addEventListener("submit", onSaveDetalj);
    const adm = document.getElementById("admin-form");
    if (adm) adm.addEventListener("submit", onSaveAdmin);
    const regIn = document.getElementById("f-regnr");
    if (regIn) regIn.addEventListener("blur", ev => {
      if (ev.target.value.trim()) ev.target.value = normalizeRegnr(ev.target.value);
    });
  }

  function onRegister(ev) {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const regnr = normalizeRegnr(fd.get("regnr"));
    const telefon = normalizePhone(fd.get("telefon"));
    const typ = fd.get("typ") || "Vinter";
    const samtycke = ev.target.querySelector("#f-samtycke").checked;
    if (!validRegnr(regnr)) { ui.formErr = "Ange registreringsnummer med tre bokstäver och tre siffror, t.ex. ABC 123."; render(); return; }
    if (!validPhone(telefon)) { ui.formErr = "Ange ett svenskt mobilnummer, t.ex. 070-000 00 00."; render(); return; }
    if (!samtycke) { ui.formErr = "Samtycke till SMS krävs för att registrera."; render(); return; }
    ui.formErr = "";
    let c = findByReg(regnr);
    if (c) {
      c.telefon = telefon;
      c.typ = typ;
      if (c.status === "ute") c.status = "vantar";
    } else {
      c = {
        id: state.nextKundId++,
        namn: "Ny kund",
        telefon, regnr, bil: "", typ,
        falgar: true, monster: null, hylla: null,
        status: "vantar",
        kommentar: "Registrerad via QR av kund"
      };
      state.customers.push(c);
    }
    const text = renderText(state.settings.texts.bekraftelse, c);
    addSms(c, "bekraftelse", text, "levererat");
    saveState();
    go("/kund/tack?id=" + c.id);
  }

  function onSaveDetalj(ev) {
    ev.preventDefault();
    const id = Number(ev.target.getAttribute("data-id"));
    const c = state.customers.find(x => x.id === id);
    if (!c) return;
    const fd = new FormData(ev.target);
    const hylla = (fd.get("hylla") || "").trim() || null;
    const monster = fd.get("monster");
    c.hylla = hylla;
    c.monster = monster === "" ? null : Number(monster);
    c.kommentar = (fd.get("kommentar") || "").trim();
    if (hylla && c.status !== "inne") c.status = "inne";
    if (!hylla && c.status === "inne") c.status = "vantar";
    saveState();
    toast("Uppgifterna är sparade");
  }

  function onSaveAdmin(ev) {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    state.settings.avsandare = (fd.get("avsandare") || "WoxBil").slice(0, 11);
    state.settings.texts.bekraftelse = fd.get("bekraftelse") || "";
    state.settings.texts.inlamning = fd.get("inlamning") || "";
    state.settings.texts.utlamning = fd.get("utlamning") || "";
    state.settings.texts.kallelseVS = fd.get("kallelseVS") || "";
    state.settings.texts.kallelseSV = fd.get("kallelseSV") || "";
    state.settings.sommarStart = fd.get("sommarStart") || state.settings.sommarStart;
    state.settings.vinterStart = fd.get("vinterStart") || state.settings.vinterStart;
    saveState();
    toast("Inställningarna är sparade");
  }

  function lamnaUt(id) {
    const c = state.customers.find(x => x.id === id);
    if (!c) return;
    c.status = "ute";
    c.hylla = null;
    const text = renderText(state.settings.texts.utlamning, c);
    addSms(c, "utlamning", text, "levererat");
    saveState();
    toast("Utlämnad · SMS-kvitto skickat till " + c.telefon);
    render();
  }

  function lamnaIn(id) {
    const c = state.customers.find(x => x.id === id);
    if (!c) return;
    if (!c.hylla) {
      const free = freeShelves();
      if (!free.length) { toast("Inga lediga hyllor just nu"); return; }
      c.hylla = free[0];
    }
    c.status = "inne";
    const text = renderText(state.settings.texts.inlamning, c);
    addSms(c, "inlamning", text, "levererat");
    saveState();
    toast("Inlämnad på " + c.hylla + " · SMS-kvitto skickat till " + c.telefon);
    render();
  }

  function skickaKallelse() {
    const rik = ui.kallelseRiktning;
    const rec = recipientsFor(rik);
    const tpl = rik === "vs" ? state.settings.texts.kallelseVS : state.settings.texts.kallelseSV;
    const replyMap = {};
    FAKE_REPLIES.forEach(r => { replyMap[r.id] = r.text; });
    const mottagare = rec.map((c, i) => {
      const text = renderText(tpl, c);
      let status = "levererat";
      let svar = null;
      if (replyMap[c.id]) { status = "besvarad"; svar = replyMap[c.id]; }
      else if (i === rec.length - 1) status = "skickat";
      else if (c.id === 21) status = "fel";
      addSms(c, "kallelse", text, status === "besvarad" ? "besvarad" : status);
      if (svar) {
        addSms(c, "svar", svar, "besvarad", { riktning: "in" });
      }
      return { id: c.id, status, svar };
    });
    state.kallelse = { riktning: rik, at: nowIso(), mottagare };
    saveState();
    toast(rec.length + " kallelser skickade (simulerat)");
    render();
  }

  function resetDemo() {
    if (!confirm("Återställ demon till ursprunglig demodata?")) return;
    localStorage.removeItem(STORAGE_KEY);
    state = seedState();
    ui.q = "";
    ui.success = null;
    ui.kallelseRiktning = "vs";
    ui.formErr = "";
    toast("Demon är återställd");
    go("/registrera");
  }

  document.addEventListener("click", ev => {
    const btn = ev.target.closest("[data-act]");
    if (!btn) return;
    const act = btn.getAttribute("data-act");
    if (act === "mode") {
      if (btn.getAttribute("data-mode") === "kund") go("/registrera");
      else go("/sok");
    } else if (act === "tab") {
      go("/" + btn.getAttribute("data-tab"));
    } else if (act === "go") {
      go(btn.getAttribute("data-hash"));
    } else if (act === "reset") {
      resetDemo();
    } else if (act === "zone") {
      ui.zone = btn.getAttribute("data-zone");
      go("/hyllor?zon=" + ui.zone);
    } else if (act === "lamna-ut") {
      lamnaUt(Number(btn.getAttribute("data-id")));
    } else if (act === "lamna-in") {
      lamnaIn(Number(btn.getAttribute("data-id")));
    } else if (act === "skicka-kallelse") {
      skickaKallelse();
    } else if (act === "ny-kallelse") {
      state.kallelse = null;
      saveState();
      render();
    } else if (act === "ledig") {
      toast("Hylla " + btn.getAttribute("data-hylla") + " är ledig");
    }
  });

  window.addEventListener("hashchange", () => { parseHash(); render(); });

  parseHash();
  render();
})();

  </script>
</body>
</html>
